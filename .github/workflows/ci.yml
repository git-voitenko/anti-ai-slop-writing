name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # no dependencies to install: the detector uses the standard library only
      - name: Tests
        run: npm test

      - name: Validate skill structure
        run: npm run lint:skill

      - name: Validate packaged Codex plugin
        run: npm run check:codex-plugin

      - name: Self-scan the documentation
        run: node scripts/self-scan.js --check
